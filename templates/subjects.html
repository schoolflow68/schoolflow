{% extends "base.html" %}{% block content %}<h1>จัดการรายวิชา</h1><p class="muted">ชื่อวิชา รหัสวิชา และผู้สอน</p><div class="card"><form method="post" class="row"><div class="field"><label>ชื่อวิชา *</label><input name="name" required></div><div class="field"><label>รหัสวิชา</label><input name="code"></div><div class="field"><label>ผู้สอน</label><input name="teacher"></div><button>เพิ่มรายวิชา</button></form></div><div class="card"><div class="tablewrap"><table><tr><th>วิชา</th><th>รหัส</th><th>ผู้สอน</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.code or '-' }}</td><td>{{ r.teacher or '-' }}</td><td><form method="post" action="{{ url_for('delete_subject',item_id=r.id) }}" onsubmit="return confirm('ลบรายวิชานี้?')"><button class="danger">ลบ</button></form></td></tr>{% else %}<tr><td colspan="4">ยังไม่มีรายวิชา</td></tr>{% endfor %}</table></div></div>{% endblock %}
